name: ping
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://whitex.onrender.com/healthz) || true
            echo "status $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
